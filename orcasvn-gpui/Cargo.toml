[package]
name = "orcasvn-gpui"
version = "0.8.1-alpha.1"
description = "OrcaSVN 客户端 (Rust + GPUI，实验分支)"
license = "MIT"
edition = "2021"

[dependencies]
gpui-kit = "0.10"
orcasvn-core = { path = "../orcasvn-core" }
# gpui-kit re-exports GPUI (a pinned 0.3.12 snapshot published as
# `gpui-pre`) plus the styled component layer, so the application depends on
# exactly one UI crate.
rfd = "0.17"
directories = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "process", "sync", "fs"] }
thiserror = "2"
quick-xml = "0.37"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[profile.release]
lto = true
strip = true
