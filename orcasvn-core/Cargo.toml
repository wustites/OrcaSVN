[package]
name = "orcasvn-core"
version = "0.8.0-alpha.1"
description = "OrcaSVN shared SVN backend (used by the native clients)"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "process", "sync", "fs"] }
thiserror = "2"
quick-xml = "0.37"
chrono = "0.4"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }
